apiVersion: argoproj.io/v1alpha1
kind: ClusterWorkflowTemplate
metadata:
  name: fast-rsm-notebook
  labels:
    workflows.diamond.ac.uk/science-group-surfaces: "true"
  annotations:
    workflows.argoproj.io/title: fast_rsm
    workflows.argoproj.io/description: |
      utility which takes in a experimental setup file and a scan number, then performs recirpocal space mapping and saves the results to an outpath.
    workflows.diamond.ac.uk/parameter-schema: |
      {{- .Files.Get "schemas/frm_multi_schema.json" | nindent 6 }}
    workflows.diamond.ac.uk/ui-schema: |
      {{- .Files.Get "schemas/frm_multi_uischema.json" | nindent 6 }}
    workflows.diamond.ac.uk/repository: https://github.com/DiamondLightSource/fast_rsm
spec:
  entrypoint: fast-rsm-notebook
  arguments:
    parameters:
    - name: visitdir
      valueFrom:
        configMapKeyRef:
          name: sessionspaces
          key: data_directory
    - name: exp_file
      value: /dls/i07/data/2026/cm44146-1/ExampleData/si30563_exp.py
    - name: calc_file
      value: /dls/i07/data/2026/cm44146-1/ExampleData/example_calc_setup.py
    - name: scanlist_commands
      value: ["-s 432196"]
  volumes:
    - name: session
      hostPath:
        path: "{{`{{ workflow.parameters.visitdir }}`}}"
        type: Directory
    - name: exampledata
      hostPath:
        path: "/dls/i07/data/2026/cm44146-1/ExampleData/"
        type: Directory

  volumeClaimTemplates:
  - metadata:
      name: tmp
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: netapp


  templates:
  - name: fast-rsm-mount-files
    script:
      image: ghcr.io/diamondlightsource/workflows:devwf_v2-4-3
      command: [bash]
      source: |
        # mount-files
        echo '{{ .Files.Get "notebooks/processing_scanlist.ipynb" | b64enc }}' | base64 -d > /tmp/notebook.ipynb
      volumeMounts:
        - name: tmp
          mountPath: /tmp


  - name: run-all-scan-lists
    steps:
    - - name: run-fast-rsm
        template: run-fast-rsm-notebook
        arguments:
          parameters:
          - name: scan_list
            value: "{{item}}"
        withParam: "{{workflow.parameters.scanlist_commands}}"

    
  - name: run-fast-rsm-notebook
    script:
      image: ghcr.io/diamondlightsource/workflows:devwf_v2-4-3
      env:
      - name: HOME
        value: /tmp
      command: [bash]
      source: |
          python -m papermill /tmp/notebook.ipynb /tmp/notebook_filled.ipynb \
            -p exp_file "{{`{{ workflow.parameters.exp_file }}`}}" \
            -p scan_list ["{{inputs.parameters.scan_list}}"] \
            -p calc_file "{{`{{ workflow.parameters.calc_file }}`}}" ;\
          python -m nbconvert --allow-errors --to html --output-dir /tmp /tmp/notebook_filled.ipynb
      volumeMounts:
      - name: session
        mountPath: "{{`{{ workflow.parameters.visitdir }}`}}"
      - name: tmp
        mountPath: /tmp
      - name: exampledata
        mountPath: /dls/i07/data/2026/cm44146-1/ExampleData/

    outputs:
      artifacts:
        - name: notebook
          path: /tmp/notebook_filled.html
          archive:
            none: {}
    podSpecPatch: |
      containers:
      - name: main
        resources:
          requests:
            cpu: 10
            memory: 30Gi
          limits:
            cpu: 10
            memory: 30Gi

  - name: fast-rsm-notebook-multi
    dag:
      tasks:
        - name: setup
          template: fast-rsm-mount-files
        - name: run-all-scans
          template: run-all-scan-lists
          dependencies: [setup]
